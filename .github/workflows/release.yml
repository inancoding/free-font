name: Release

# 打 tag 触发，tag 形如 <slug>-v<version>，例如 zhuque-fangsong-v0.212
on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

# 同一 tag 的重跑排队而非并发，避免两个 job 同时改同一个 Release
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 发版前重跑校验：授权白名单和 sha256 缺失都必须在这里挡住，
      # 不能让一个未通过合规校验的字体被发布出去
      - run: npm run typecheck
      - run: npm run validate

      - name: 下载官方产物并校验 SHA-256
        run: npm run fetch-artifact -- "${{ github.ref_name }}"

      - name: 读取 Release 标题
        id: relname
        run: echo "name=$(cat build/RELEASE_NAME.txt)" >> "$GITHUB_OUTPUT"

      - name: 发布 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relname.outputs.name }}
          body_path: build/RELEASE_NOTES.md
          files: build/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
