name: Release

# 打 tag 触发，tag 形如 <slug>-v<version>
# ZIP 已提交至仓库 zips/ 目录，此处仅校验并创建 GitHub Release
on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck
      - run: pnpm run validate

      - name: 生成 Release 标题和描述
        run: pnpm exec tsx scripts/release-info.ts "${{ github.ref_name }}"

      - name: 读取 Release 标题
        id: relname
        run: echo "name=$(cat build/RELEASE_NAME.txt)" >> "$GITHUB_OUTPUT"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relname.outputs.name }}
          body_path: build/RELEASE_NOTES.md
          draft: false
          prerelease: false
