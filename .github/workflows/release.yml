name: Release

# 打 tag 触发，tag 形如 <slug>-v<version>，例如 zhuque-fangsong-v0.212
# 流程：校验 tag → 生成 Release 骨架 → 手动上传 zip 附件
on:
  push:
    tags: ['*-v*']

permissions:
  contents: write

# 同一 tag 的重跑排队而非并发，避免两个 job 同时改同一个 Release
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 发版前重跑校验：授权白名单和 sha256 缺失都必须在这里挡住
      - run: pnpm run typecheck
      - run: pnpm run validate

      - name: 生成 Release 标题和描述
        run: pnpm exec tsx scripts/release-info.ts "${{ github.ref_name }}"

      - name: 读取 Release 标题
        id: relname
        run: echo "name=$(cat build/RELEASE_NAME.txt)" >> "$GITHUB_OUTPUT"

      - name: 创建 Release（骨架，无附件）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.relname.outputs.name }}
          body_path: build/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: ''
