name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # 每周一 UTC 02:00 跑一次死链巡检
    - cron: '0 2 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate

  # 死链检查单独跑，且只在定时任务里执行。
  # 放进 PR 检查会因为第三方站点反爬或临时故障频繁误报，
  # 一旦开始误报，维护者就会习惯性忽略红灯。
  links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run validate -- --check-links
