name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 检查所有字体并补创建缺失的 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git checkout "$SHA"

          # 一次性拉取所有远端 tag，避免循环中反复请求
          git fetch --tags origin
          ALL_REMOTE_TAGS=$(git tag -l --remote 'origin/*' | sed 's|origin/refs/tags/||')

          CREATED=0
          SKIPPED=0

          for file in fonts/*.json; do
            [ -f "$file" ] || continue
            slug=$(basename "$file" .json)
            version=$(jq -r '.version' "$file")
            tag="${slug}-v${version}"

            if echo "$ALL_REMOTE_TAGS" | grep -qx "$tag"; then
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "创建 Release: ${tag}"
            pnpm exec tsx scripts/release-info.ts "$tag"

            gh release create "$tag" \
              --title "$(cat build/RELEASE_NAME.txt)" \
              --notes-file build/RELEASE_NOTES.md

            echo "✓ ${tag} 创建完成"
            CREATED=$((CREATED + 1))

            # 更新本地 tag 列表，防止同批次重复创建
            ALL_REMOTE_TAGS="$ALL_REMOTE_TAGS
          $tag"
          done

          echo ""
          echo "完成：创建 ${CREATED} 个 Release，跳过 ${SKIPPED} 个已有 tag 的字体"
